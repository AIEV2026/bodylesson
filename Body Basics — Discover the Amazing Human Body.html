<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Basics — Discover the Amazing Human Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>:root{
  --teal:#159E93; --teal-d:#0E7A71; --teal-dd:#0B5F58; --mint:#E5F5EF; --cream:#FAF8F2;
  --coral:#F3A69B; --coral-d:#C8584A; --yellow:#F4CE70; --blue:#DCEEF8; --ink:#27343A;
  --ink2:#4E5C62; --white:#FFFFFF; --line:#E3E7E2; --red:#C9433B; --vein:#4A78BD;
  --ok:#1E8A5A; --okbg:#E3F4EA; --no:#B5473A; --nobg:#FBE9E5;
  --r:18px; --r2:26px; --sh:0 1px 2px rgba(39,52,58,.05),0 6px 22px rgba(39,52,58,.07);
  --sh2:0 2px 4px rgba(39,52,58,.06),0 14px 40px rgba(39,52,58,.10);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0 0 .4em;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--teal-d)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(250,248,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap;background:none;border:0;cursor:pointer;padding:4px}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:15px;color:var(--ink2)}
.nav button:hover{background:var(--mint);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--mint);color:var(--teal-dd)}
.coinpill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #EFE3BE;border-radius:999px;padding:5px 13px 5px 6px;font-weight:700;box-shadow:var(--sh);cursor:pointer}
.coinpill svg{width:26px;height:26px}
.coinpill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
@media (max-width:720px){
  .nav .lbl-long{display:none}
  .nav button{padding:8px 9px;font-size:14px}
  .logo span{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;text-decoration:none;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--teal-d);color:#fff;box-shadow:0 4px 14px rgba(14,122,113,.28)}
.btn-p:hover{background:var(--teal-dd)}
.btn-s{background:#fff;color:var(--teal-dd);border:2px solid #CBE7DF}
.btn-s:hover{border-color:var(--teal)}
.btn-g{background:transparent;color:var(--ink2);padding:10px 16px}
.btn-g:hover{background:rgba(0,0,0,.04)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:8px 15px;min-height:38px;font-size:14.5px}

/* hero */
.hero{padding:36px 0 18px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);background:var(--mint);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.hero h1{font-size:clamp(46px,7vw,86px);letter-spacing:.01em;margin-bottom:6px;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--teal-d)}
.hero .sub{font-family:var(--serif);font-size:clamp(20px,2.4vw,26px);color:var(--ink2);margin-bottom:18px;font-weight:400}
.hero .lead{font-size:19px;max-width:520px;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px}
.meta span{background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--ink2)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.heroart{position:relative;background:radial-gradient(ellipse at 50% 40%,#fff 0%,var(--mint) 70%);border-radius:40px;padding:18px 10px 10px;box-shadow:var(--sh)}
.heroart svg.body{width:100%;max-height:560px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 6px 8px}
.legend button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 8px;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.legend button i{width:11px;height:11px;border-radius:50%;display:inline-block}
.legend button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.heroart .sys{transition:opacity .35s}
.heroart.focus .sys{opacity:.12}
.heroart.focus .sys.hl{opacity:1}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.heroart{max-width:440px;margin:0 auto}}

/* home progress strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 10px}
.stat{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}
.stat b{font-family:var(--serif);font-size:30px;line-height:1}
.stat small{display:block;color:var(--ink2);font-size:14px}
.stat svg{width:42px;height:42px;flex:none}
@media (max-width:640px){.strip{grid-template-columns:1fr}}

/* chapter map */
.section{padding:30px 0}
.section h2{font-size:clamp(28px,3.6vw,40px)}
.adv{margin:22px 0 34px}
.advhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.advhead .num{font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;background:var(--teal-d);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;transform:translateY(4px)}
.advhead h3{font-size:26px;margin:0}
.advhead .days{color:var(--ink2);font-weight:700;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.lcard{position:relative;text-align:left;background:#fff;border:1px solid transparent;border-radius:var(--r2);padding:16px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s,border-color .2s;min-height:228px}
.lcard:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#CBE7DF}
.lcard .ill{height:104px;border-radius:16px;display:grid;place-items:center;margin-bottom:6px}
.lcard .ill svg{height:88px;width:auto}
.lcard .day{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-d)}
.lcard h4{font-size:19px;margin:0}
.lcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:14px;font-weight:700}
.badge-state{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12.5px}
.st-done{background:var(--okbg);color:var(--ok)}
.st-prog{background:#FFF4D6;color:#8A6410}
.st-new{background:#F1F3F1;color:var(--ink2)}
.bg-mint{background:var(--mint)}.bg-blue{background:var(--blue)}.bg-cream{background:#F6F0E2}.bg-coral{background:#FCE7E2}.bg-yellow{background:#FDF3D6}

/* lesson shell */
.lesson{padding:18px 0 60px}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lhead .t{flex:1;min-width:200px}
.lhead .t small{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;color:var(--teal-d)}
.lhead h1{font-size:clamp(24px,3.3vw,34px);margin:2px 0 0}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 18px}
.steps button{border:0;background:none;padding:0;cursor:pointer;text-align:left}
.steps .bar{height:7px;border-radius:9px;background:#E3E8E4;overflow:hidden;position:relative}
.steps .bar i{position:absolute;inset:0;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.steps .done .bar i,.steps .cur .bar i{transform:none}
.steps .cur .bar i{background:var(--yellow)}
.steps span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .cur span{color:var(--ink)}
.steps button[disabled]{cursor:default}
@media (max-width:640px){.steps span{display:none}.steps .cur span{display:block;position:absolute;left:0;right:0;top:13px;text-align:left}.steps{margin-bottom:34px;position:relative}.steps button{position:static}}
.stage{background:#fff;border-radius:30px;box-shadow:var(--sh);padding:28px;min-height:420px;animation:fadeup .45s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
.stage h2{font-size:clamp(24px,3vw,32px)}
.stagetag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-d);margin-bottom:8px}
.stagetag svg{width:22px;height:22px}
.stagetime{color:var(--ink2);font-weight:400;letter-spacing:0;text-transform:none}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.lfoot .note{color:var(--ink2);font-size:14.5px;flex:1;text-align:center;min-width:160px}
@media (max-width:640px){.stage{padding:20px 16px;border-radius:24px}body{font-size:16.5px}}

.two{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:start}
.two.rev{grid-template-columns:1.1fr 1fr}
@media (max-width:860px){.two,.two.rev{grid-template-columns:1fr}}

/* progressive text */
.reveal p{font-size:19px;margin:0 0 12px;padding-left:16px;border-left:3px solid var(--mint);animation:fadeup .45s ease}
.reveal p.key{border-left-color:var(--teal)}
.reveal p strong{color:var(--teal-dd)}
.hook{background:var(--blue);border-radius:18px;padding:14px 18px;font-family:var(--serif);font-size:20px;margin-bottom:16px;display:flex;gap:12px;align-items:center}
.hook svg{width:34px;height:34px;flex:none}
.callout{background:#FFF7E3;border-radius:16px;padding:12px 16px;font-size:15.5px;margin:12px 0;border:1px solid #F4E2AE}
.callout b{color:#7A5A0D}

/* visual panels */
.panel{background:var(--cream);border-radius:22px;padding:14px;position:relative}
.panel svg{display:block;width:100%;height:auto}
.panel .cap{font-size:14.5px;color:var(--ink2);text-align:center;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;justify-content:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.info{margin-top:10px;background:#fff;border-radius:16px;padding:12px 16px;min-height:62px;border:1px solid var(--line);font-size:15.5px}
.info h4{font-size:18px;margin:0 0 4px}
.hs [data-hs]{cursor:pointer;transition:opacity .3s,filter .3s}
.hs.focus [data-hs]{opacity:.25}
.hs.focus [data-hs].hl{opacity:1;filter:drop-shadow(0 0 5px rgba(21,158,147,.6))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:0;background:#EEF1EE;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

/* animation player */
.player{background:linear-gradient(180deg,#F4FAF7,#fff);border:1px solid var(--line);border-radius:24px;padding:12px;margin-bottom:14px}
.player .screen{border-radius:16px;overflow:hidden;background:var(--cream);position:relative}
.player .screen svg{display:block;width:100%;height:auto}
.player .ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.player .ctrl .btn{padding:8px 14px;min-height:40px;font-size:14.5px}
.player .dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.player .dots button{width:11px;height:11px;border-radius:50%;border:0;background:#D7DED9;padding:0;cursor:pointer}
.player .dots button.on{background:var(--teal)}
.player .dots button.cur{background:var(--ink);transform:scale(1.25)}
.player .caption{min-height:52px;font-size:17px;padding:10px 6px 2px;font-weight:700;color:var(--ink)}
.player .caption small{display:block;font-weight:400;color:var(--ink2);font-size:15px}
.ptitle{font-family:var(--serif);font-weight:600;font-size:19px;margin:2px 4px 8px}

/* animation primitives */
.anim .a{opacity:0;transition:opacity .7s ease}
.anim .a.on{opacity:1}
.anim .a.past{opacity:0}
.anim [data-to]{transition:transform 1.1s cubic-bezier(.45,.05,.3,1),opacity .7s}
.anim .scene{opacity:0;transform:scale(.45);transition:transform 1.3s cubic-bezier(.5,0,.25,1),opacity 1s;transform-box:view-box;transform-origin:50% 50%}
.anim .scene.on{opacity:1;transform:scale(1)}
.anim .scene.past{opacity:0;transform:scale(3.2)}
.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s ease}
.anim .draw.on{stroke-dashoffset:0}
.anim .beat.on{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 55%}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(.97)}}
.anim .breathe.on{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06,1.08)}}
.anim .churn.on{animation:churn 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes churn{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-3deg) scale(1.03,.97)}75%{transform:rotate(3deg) scale(.97,1.03)}}
.anim .wig.on{animation:wig 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes wig{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-2px) rotate(6deg)}}
.anim .glow.on{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.anim .spin.on{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.anim .wave.on{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:0% 50%}
@keyframes wave{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.4)}}
.anim .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}

/* questions */
.q{margin:0 0 18px}
.q .qt{font-size:19px;font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.q .qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--teal-dd);display:grid;place-items:center;font-size:14px;margin-top:1px}
.opts{display:grid;gap:9px}
.opts.grid2{grid-template-columns:1fr 1fr}
@media (max-width:520px){.opts.grid2{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;font-size:17px;font-weight:700;transition:all .15s;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--teal);background:#FBFEFD}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:#F1F3F1;display:grid;place-items:center;font-size:14px;color:var(--ink2)}
.opt.sel{border-color:var(--teal);background:var(--mint)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:#E7B4AA;background:var(--nobg);animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{margin-top:10px;border-radius:14px;padding:11px 15px;font-size:16px;animation:fadeup .3s}
.fb.ok{background:var(--okbg);color:#145C3D}
.fb.no{background:#FFF4E5;color:#7A4A0B}
.fb.info{background:var(--blue);color:#1E4460}
.fb b{display:block}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{flex:1;justify-content:center;min-width:110px}

/* inputs */
.inp{width:100%;font:inherit;font-size:17px;padding:12px 15px;border:2px solid var(--line);border-radius:14px;background:#FDFDFB;color:var(--ink);transition:border-color .15s}
.inp:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px rgba(21,158,147,.15)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.inp.right{border-color:var(--ok);background:var(--okbg)}
.inp.wrong{border-color:#E5B3A5}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--teal);margin:0 4px;text-align:center;font-weight:700;color:var(--teal-dd);padding:0 6px}
.recall-row{margin-bottom:14px}
.recall-row label{display:block;font-weight:700;margin-bottom:6px;font-size:17.5px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}

/* order activity */
.order .slots{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;padding:12px;border-radius:18px;background:var(--mint);min-height:110px;margin-bottom:12px;position:relative}
.order .slot{flex:1 1 120px;min-height:92px;border:2px dashed #A9D8CC;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--teal-dd);position:relative;background:rgba(255,255,255,.4)}
.order .slot .n{position:absolute;top:5px;left:8px;font-weight:700;font-size:12.5px;opacity:.7}
.order .slot.filled{border-style:solid;border-color:transparent;background:none;padding:0}
.order .slot.over{border-color:var(--teal);background:#fff}
.order .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
.ocard{flex:1 1 120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 8px;cursor:grab;font-weight:700;font-size:15px;text-align:center;min-height:88px;width:100%;transition:border-color .15s,background .15s,transform .15s;touch-action:none;user-select:none}
.ocard svg{width:46px;height:46px}
.ocard:hover{border-color:var(--teal)}
.ocard.dragging{opacity:.5}
.ocard.right{border-color:var(--ok);background:var(--okbg)}
.ocard.wrong{border-color:#E5B3A5;background:var(--nobg)}
.order .pool .ocard{max-width:170px}
.order.chain .slots .slot+.slot::before{content:"";position:absolute;left:-9px;top:50%;width:10px;height:3px;background:var(--teal);animation:grow .6s ease both}
@keyframes grow{from{transform:scaleX(0)}}
.order.chain .ocard{animation:linkglow 1.2s ease both}
.order.chain .slot:nth-child(2) .ocard{animation-delay:.15s}.order.chain .slot:nth-child(3) .ocard{animation-delay:.3s}.order.chain .slot:nth-child(4) .ocard{animation-delay:.45s}.order.chain .slot:nth-child(5) .ocard{animation-delay:.6s}.order.chain .slot:nth-child(6) .ocard{animation-delay:.75s}
@keyframes linkglow{40%{box-shadow:0 0 0 6px rgba(21,158,147,.25)}}
.hidelabels .ocard .lb{visibility:hidden}

/* match activity */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.match .col{display:flex;flex-direction:column;gap:9px}
.match .col h5{margin:0 0 2px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.mi{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px;cursor:pointer;min-height:54px;transition:all .15s;position:relative}
.mi:hover:not([disabled]){border-color:var(--teal)}
.mi.sel{border-color:var(--teal);background:var(--mint);box-shadow:0 0 0 3px rgba(21,158,147,.18)}

@media (max-width:560px){.match{grid-template-columns:1fr 1fr;gap:10px}.mi{font-size:14.5px;padding:8px 9px;gap:6px}.mi svg{width:26px;height:26px}}

/* sort columns */
.sortgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sortcol{background:var(--cream);border-radius:18px;padding:12px;min-height:140px}
.sortcol h5{margin:0 0 8px;font-family:var(--serif);font-size:18px;display:flex;gap:8px;align-items:center}
.sortcol h5 svg{width:30px;height:30px}
.sitem{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:8px;font-weight:700;font-size:15.5px}

/* label */
.labelwrap{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center}
@media (max-width:700px){.labelwrap{grid-template-columns:1fr}}
.pin{cursor:pointer}
.pin circle{transition:all .2s}
.pin.sel circle.c{fill:var(--yellow);stroke:var(--ink)}
.pin.right circle.c{fill:var(--ok)}

/* think */
.think .qbox{background:linear-gradient(135deg,var(--blue),#EAF6F3);border-radius:22px;padding:20px 22px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}

.answer{background:var(--okbg);border-radius:18px;padding:16px 18px;margin-top:14px;animation:fadeup .4s}
.answer h4{font-size:18px;color:#145C3D;margin-bottom:4px}
.selfrate{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.selfrate span{font-weight:700;font-size:15px;margin-right:4px}

/* memory */
.mission{background:linear-gradient(160deg,#27343A,#33464D);color:#fff;border-radius:24px;padding:20px 22px;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.mission svg{width:58px;height:58px;flex:none}
.mission h3{color:#fff;font-size:24px;margin:0 0 3px}
.mission p{margin:0;color:#D9E4E1;font-size:16px}
.keyideas{list-style:none;padding:0;margin:10px 0}
.keyideas li{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:16px}
.keyideas li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;margin-top:2px}
.keyideas li.got i{background:var(--ok);color:#fff}
.keyideas li.miss i{background:#EDE6D6;color:#8A6410}

/* coins */
.coinfly{position:fixed;z-index:100;pointer-events:none;width:34px;height:34px;transition:transform .9s cubic-bezier(.5,-0.2,.4,1),opacity .9s}
.award{display:flex;align-items:center;gap:12px;background:#FFF9E8;border:1px solid #F1DFA6;border-radius:16px;padding:10px 16px;margin:12px 0;font-weight:700;animation:fadeup .4s}
.award svg{width:32px;height:32px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px 12px 12px;border-radius:999px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:var(--sh2);opacity:0;transition:all .35s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast svg{width:30px;height:30px}

/* completion */
.complete{text-align:center;padding:16px 0}
.complete h2{font-size:clamp(28px,4vw,42px)}

.coinrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}

.deeper{text-align:left;background:var(--cream);border-radius:20px;padding:16px 20px;margin:20px auto 0;max-width:680px}
.deeper summary{cursor:pointer;font-weight:700;font-family:var(--serif);font-size:19px}
.deeper ol{margin:10px 0 0;padding-left:22px}
.deeper li{margin-bottom:8px}

/* coins page / review */
.pagehead{padding:30px 0 10px}
.pagehead h1{font-size:clamp(32px,4.6vw,50px)}
.bigcoin{display:flex;gap:22px;align-items:center;background:#fff;border-radius:30px;padding:26px;box-shadow:var(--sh);margin-bottom:18px;flex-wrap:wrap}
.bigcoin svg{width:96px;height:96px}
.bigcoin b{font-family:var(--serif);font-size:64px;line-height:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:820px){.grid4{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh)}
.tile b{font-family:var(--serif);font-size:34px;display:block;line-height:1.1}
.tile span{color:var(--ink2);font-weight:700;font-size:14.5px}
.ctable{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:10px}
.ctable td,.ctable th{padding:9px 12px;text-align:left;font-size:15px}
.ctable th{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.ctable tr.r td{background:#fff}
.ctable tr.r td:first-child{border-radius:12px 0 0 12px}
.ctable tr.r td:last-child{border-radius:0 12px 12px 0}
.dotc{display:inline-block;width:14px;height:14px;border-radius:50%;background:#E3E8E4;margin-right:3px;vertical-align:middle}
.dotc.on{background:linear-gradient(135deg,#F7DA82,#D9A520)}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.concept{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.concept .top2{display:flex;gap:12px;align-items:center}
.concept .top2 svg{width:46px;height:46px}
.concept h4{margin:0;font-size:18px}
.meter{height:8px;border-radius:8px;background:#EEF1EE;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:8px}
.lvl{font-size:13.5px;font-weight:700}
.lvl.need{color:#9A5B10}.lvl.good{color:var(--ok)}.lvl.new{color:var(--ink2)}

/* parents */
.parents{background:#fff}
.phero{background:linear-gradient(180deg,var(--mint),#fff);padding:46px 0 26px}

.phero .kicker{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--teal-d)}
.pbody{max-width:860px;margin:0 auto;padding:0 22px 60px}
.pbody h2{font-size:clamp(26px,3.2vw,36px);margin-top:46px;padding-top:10px;border-top:1px solid var(--line)}
.pbody h3{font-size:22px;margin-top:22px}
.pbody p,.pbody li{font-size:18px;line-height:1.65}
.pbody .lede{font-family:var(--serif);font-size:22px;line-height:1.5;color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media (max-width:700px){.pcards{grid-template-columns:repeat(2,1fr)}}
.pcard{background:var(--cream);border-radius:20px;padding:16px}
.pcard small{display:block;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink2)}
.pcard b{font-family:var(--serif);font-size:26px}
.approach{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.acard{background:var(--cream);border-radius:22px;padding:18px}
.acard svg{width:54px;height:54px;margin-bottom:6px}
.acard h4{font-size:19px;margin:0 0 4px}
.acard p{font-size:16px!important;margin:0}
.advlist{display:grid;gap:12px;margin:14px 0}
.advlist div{display:flex;gap:14px;background:var(--cream);border-radius:18px;padding:14px 18px;align-items:flex-start}
.advlist div b{font-family:var(--serif);font-size:20px;display:block}
.advlist .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--teal-d);color:#fff;font-weight:700;display:grid;place-items:center;margin-top:3px}
.homeacts{list-style:none;padding:0;display:grid;gap:8px}
.homeacts li{display:flex;gap:14px;background:var(--cream);border-radius:14px;padding:10px 16px;font-size:17px!important}
.homeacts li b{flex:none;width:62px;color:var(--teal-d)}
.checklist{list-style:none;padding:0}
.checklist li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.checklist li::before{content:"";flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--teal);margin-top:4px}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.ages{grid-template-columns:1fr}}
.ages>div{background:var(--cream);border-radius:22px;padding:18px 20px}
.ages ul{padding-left:20px;margin:6px 0 0}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{font-weight:700;font-size:18.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-size:24px;color:var(--teal-d);line-height:1}

.faq p{margin:8px 0 0}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.toc a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;text-decoration:none;font-weight:700;font-size:14.5px;color:var(--ink2)}
.toc a:hover{border-color:var(--teal);color:var(--teal-dd)}
.deeplist{background:var(--cream);border-radius:20px;padding:6px 20px}
.deeplist details{border-bottom:1px solid var(--line);padding:10px 0}
.deeplist details:last-child{border:0}
.deeplist summary{font-weight:700;cursor:pointer}
.deeplist ul{margin:8px 0 4px}

footer{padding:30px 0 40px;color:var(--ink2);font-size:14.5px;text-align:center}
.settings{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.switch input{width:18px;height:18px;accent-color:var(--teal-d)}
.modal{position:fixed;inset:0;background:rgba(39,52,58,.45);display:grid;place-items:center;z-index:120;padding:20px}
.modal>div{background:#fff;border-radius:24px;padding:24px;max-width:420px;box-shadow:var(--sh2)}

/* timeline */
.timeline{position:relative;display:flex;gap:10px;overflow-x:auto;padding:30px 4px 10px;scroll-snap-type:x mandatory}
.timeline::before{content:"";position:absolute;left:10px;right:10px;top:46px;height:4px;background:linear-gradient(90deg,#E8D9B5,var(--teal));border-radius:4px}
.tst{flex:1 0 128px;scroll-snap-align:start;background:none;border:0;cursor:pointer;text-align:center;position:relative;padding:0 4px}
.tst .pt{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;background:#fff;border:4px solid #E8D9B5;position:relative;z-index:1;transition:all .3s;display:grid;place-items:center;font-weight:700;font-size:14px}
.tst[aria-selected="true"] .pt{background:var(--teal-d);border-color:var(--teal-d);color:#fff;transform:scale(1.15)}
.tst b{display:block;font-size:14.5px}
.tst small{color:var(--ink2);font-size:13px;font-weight:700}
.tcard{background:var(--cream);border-radius:22px;padding:16px;margin-top:6px;display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;animation:fadeup .4s}
.tcard svg{width:100%;height:auto}
.tcard h4{font-size:22px;margin:0 0 4px}
.tcard .date{display:inline-block;background:var(--yellow);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;margin-bottom:8px}
@media (max-width:640px){.tcard{grid-template-columns:1fr}.tcard svg{max-width:240px;margin:0 auto}}
.tanim .ta{animation:fadeup .8s ease both}
.tanim .ta2{animation:fadeup .8s .5s ease both}
.tanim .ta3{animation:fadeup .8s 1s ease both}

.tanim .twig{animation:wig 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.tanim .tdraw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s .3s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}

/* workbench */
.bench{background:linear-gradient(180deg,#F2E8D6,#E9DCC2);border-radius:26px;padding:16px;box-shadow:inset 0 -10px 0 #DCCBAA}
.bench .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bitem{background:#fff;border-radius:16px;padding:10px;text-align:center;border:2px solid transparent;cursor:pointer;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.06);transition:transform .2s}
.bitem:hover{transform:translateY(-3px) rotate(-1deg)}
.bitem[aria-pressed="true"]{border-color:var(--teal)}
.bitem svg{width:56px;height:56px;display:block;margin:0 auto 4px}

.mini-q{background:var(--cream);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.mini-q h4{font-size:19px;margin:0 0 8px}
.subhead{font-family:var(--serif);font-size:22px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.subhead .pill{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--yellow);border-radius:999px;padding:3px 10px}
.done-mark{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;font-size:15px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
body.calm *,body.calm *::before,body.calm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
.anim .on .draw{stroke-dashoffset:0}
.anim .scene.zo{transform:scale(2.4)}
.anim .scene.zo.on{transform:none}
.anim .scene.zo.past{transform:scale(.3);opacity:0}
.svgl{font-family:var(--sans);font-weight:700;fill:#27343A}
.svgn{font-family:var(--sans);font-weight:700}
.svgt{font-family:var(--serif);font-weight:600;fill:#27343A}
.svgw{font-family:var(--sans);font-weight:700;fill:#fff}

@keyframes zin{from{opacity:0;transform:scale(.6)}}
@keyframes zout{from{opacity:0;transform:scale(1.5)}}
.static #sig1,.static #sig2,.static #sig3,.static #ouch,.static #cg{display:none}


.player .screen svg{max-height:min(470px,62vh);margin:0 auto}

.nav button{white-space:nowrap}

.pcard b{display:block;line-height:1.2}

function helix(x0,y0,h,amp,turns,opts={}){
  const N=Math.round(turns*28); let s1='',s2='',rungs=''; const cols=[['#F3A69B','#159E93'],['#F4CE70','#4A78BD']];
  for(let i=0;i<=N;i++){ const t=i/N, y=y0+t*h, a=t*turns*Math.PI*2; const xa=x0+amp*Math.sin(a), xb=x0+amp*Math.sin(a+Math.PI);
    s1+=(i?'L':'M')+xa.toFixed(1)+' '+y.toFixed(1)+' '; s2+=(i?'L':'M')+xb.toFixed(1)+' '+y.toFixed(1)+' ';
    if(i%2===0 && i>0 && i<N){ const pr=cols[(i/2)%2]; const xm=(xa+xb)/2; const depth=Math.cos(a);
      rungs+=`<path d="M${xa.toFixed(1)} ${y.toFixed(1)} L${xm.toFixed(1)} ${y.toFixed(1)}" stroke="${pr[0]}" stroke-width="${opts.rw||3}" opacity="${0.55+0.45*Math.abs(depth)}"/><path d="M${xm.toFixed(1)} ${y.toFixed(1)} L${xb.toFixed(1)} ${y.toFixed(1)}" stroke="${pr[1]}" stroke-width="${opts.rw||3}" opacity="${0.55+0.45*Math.abs(depth)}"/>`; } }
  return `<g stroke-linecap="round">${rungs}<path d="${s1}" fill="none" stroke="#2F6E8F" stroke-width="${opts.sw||4}"/><path d="${s2}" fill="none" stroke="#7A5EAA" stroke-width="${opts.sw||4}"/></g>`;
}

function xrayHand(){
  const fing=[[-0.95,62,2],[-0.42,96,3],[-0.12,106,3],[0.18,100,3],[0.48,84,3]];
  const bx=100, by=176; let soft='', bones='';

  fing.forEach(([a,L,n],i)=>{ const sx=bx+Math.sin(a)*(i===0?40:30), sy=by-24+(i===0?24:0); const ex=sx+Math.sin(a)*L, ey=sy-Math.cos(a)*L;
    soft+=`<path d="M${sx} ${sy} L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#7D898F" stroke-width="${i===0?20:18}" stroke-linecap="round" opacity=".55"/>`;
    const mx=bx+Math.sin(a)*(i===0?14:8), my=by+8+(i===0?2:0); const segs=[[mx,my,sx,sy]]; let px=sx,py=sy; const seg=L/(n+0.3);
    for(let k=0;k<n;k++){ const l=seg*(1-k*0.18); const nx=px+Math.sin(a)*l, ny=py-Math.cos(a)*l; segs.push([px+Math.sin(a)*3,py-Math.cos(a)*3,nx,ny]); px=nx; py=ny; }
    segs.forEach(([x1,y1,x2,y2],k)=>{ bones+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="#EEF3F5" stroke-width="${k===0?7:6-k*0.6}" stroke-linecap="round" opacity=".95"/>`; }); });
  bones+=[[86,192],[98,190],[110,192],[90,202],[104,202],[116,200],[94,212],[108,212]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="6" ry="5" fill="#E3EAED" stroke="#C5D0D4" stroke-width=".8"/>`).join('');

}

const nest = (s,x,y,w,h) => s.replace(/role="img" aria-label="[^"]*"/,'aria-hidden="true"').replace('<svg ', `<svg x="${x}" y="${y}" width="${w}" height="${h}" `);
const mv = (path, dur=2, rep=false, extra='') => `<animateMotion path="${path}" dur="${dur}s" begin="indefinite" fill="freeze" ${rep?'repeatCount="indefinite"':''} ${extra}/>`;
const T = (x,y,t,size=12,anchor='middle',cls='svgl') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}" font-size="${size}">${t}</text>`;
const pill = (x,y,t,w) => `<rect x="${x-w/2}" y="${y-14}" width="${w}" height="22" rx="11" fill="#fff" stroke="#CBE7DF"/>${T(x,y+1,t,11.5)}`;
function blob(pts){ // smooth closed path through points (Catmull-Rom → Bézier); same point count → morphable
  const n=pts.length; let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<n;i++){ const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`; }
  return d+'Z'; }

function hexCells(cx,cy,R,rows,cols,fill,stroke,nuc){ let s=''; const w=R*1.732;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const x=cx+c*w+(r%2?w/2:0), y=cy+r*R*1.5; let p='';
    for(let k=0;k<6;k++){ const a=Math.PI/180*(60*k-30); p+=(k?'L':'M')+(x+R*0.96*Math.cos(a)).toFixed(1)+' '+(y+R*0.96*Math.sin(a)).toFixed(1); }
    s+=`<path d="${p}Z" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`+(nuc?`<ellipse cx="${x+((r*7+c*3)%5)-2}" cy="${y+((r+c)%3)-1}" rx="${R*0.32}" ry="${R*0.26}" fill="${nuc}"/>`:''); }
  return s; }

/* ---------- animation player ---------- */
let TIMERS = [];

     <button class="btn btn-g btn-sm" data-a="replay" aria-label="Replay from the start">↺ Replay</button></div></div>`);
  const svg = $('svg', root), cap=$('.caption', root), playBtn=$('[data-a=play]', root);

  const nodes = {}; ids.forEach(id=>{ nodes[id]=svg.querySelector('#'+CSS.escape(id)); });

  function trigger(list){ list.forEach(id=>{ const n=nodes[id]; if(!n) return; const anims = n.matches('animate,animateMotion,animateTransform') ? [n] : $$('animate,animateMotion,animateTransform', n);
      anims.forEach(a=>{ try{ a.beginElement(); }catch(e){} }); }); }
  function apply(j, jump){ const st=stateAt(j);
    ids.forEach(id=>{ const n=nodes[id]; if(!n) return; n.classList.remove('on','past'); if(st[id]) n.classList.add(st[id]); if(n.dataset.to!==undefined) n.style.transform = st[id]==='on' ? n.dataset.to : ''; });
    if(jump){ try{ svg.setCurrentTime(0); }catch(e){} trigger(Object.keys(st).filter(k=>st[k]==='on')); } else trigger(def.steps[j].on||[]);
    const s=def.steps[j]; cap.innerHTML = `${esc(s.t)}${s.s?`<small>${esc(s.s)}</small>`:''}`;
    $$('.dots button', root).forEach((b,k)=>{ b.classList.toggle('on', k<=j); b.classList.toggle('cur', k===j); });
    $('[data-a=prev]',root).disabled = j<=0; $('[data-a=next]',root).disabled = j>=def.steps.length-1; }

    timer=setTimeout(()=>{ if(!document.body.contains(root)) return; if(i<def.steps.length-1){ go(i+1); sched(); } else if(def.loop){ timer=setTimeout(()=>{ go(0,true); sched(); }, 1200); TIMERS.push(timer); } else { setPlaying(false); playBtn.innerHTML='↺ Watch again'; playBtn.dataset.again='1'; } }, d); TIMERS.push(timer); }
  function setPlaying(p){ playing=p; playBtn.innerHTML = p?'❚❚ Pause':'▶ Play'; playBtn.setAttribute('aria-label', p?'Pause animation':'Play animation'); delete playBtn.dataset.again; if(p) sched(); else clearTimeout(timer); }
  root.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.i!==undefined){ setPlaying(false); go(+b.dataset.i, true); return; }
    const a=b.dataset.a;
    if(a==='play'){ if(b.dataset.again){ go(0,true); setPlaying(true); } else if(playing) setPlaying(false); else { if(i>=def.steps.length-1) go(0,true); else if(i<0) go(0); setPlaying(true); } }
    if(a==='next'){ setPlaying(false); go(i+1); }
    if(a==='prev'){ setPlaying(false); go(i-1, true); }
    if(a==='replay'){ go(0,true); setPlaying(!reducedMotion()); } });

/* ---------- ordering (tap or drag) ---------- */
function orderAct(cfg, onDone, onAttempt){

    if(drag.moved){ e.preventDefault(); drag.ghost.style.left=(drag.r.left+dx)+'px'; drag.ghost.style.top=(drag.r.top+dy)+'px'; $$('.slot',root).forEach(s=>s.classList.remove('over')); const t=document.elementFromPoint(e.clientX,e.clientY); const s=t&&t.closest&&t.closest('.slot'); if(s&&root.contains(s)) s.classList.add('over'); } });

    if(d.moved){ const t=document.elementFromPoint(e.clientX,e.clientY); const s=t&&t.closest&&t.closest('.slot'); const p=t&&t.closest&&t.closest('.pool');
      if(s&&root.contains(s)) place(d.c, +s.dataset.s); else if(p&&root.contains(p)) unplace(d.c); else draw(); d.b._skipClick=true; }

    $$('[data-r]',root).forEach(b=>{ const r=+b.dataset.r; const li=pairOf.indexOf(r); b.classList.toggle('sel', sel&&sel.s==='r'&&sel.i===r); b.classList.toggle('paired', li>=0); $('.tag',b).textContent = li>=0? li+1 : '–'; b.setAttribute('aria-pressed', sel&&sel.s==='r'&&sel.i===r); b.setAttribute('aria-label', cfg.pairs[r][1]+(li>=0?', matched with '+cfg.pairs[li][0]:'')); if(li>=0&&locked[li]) b.disabled=true; });

function sortAct(cfg, onDone){ // cfg: {prompt, cols:[[name,icon],[name,icon]], items:[[text, colIndex]]}
  const n=cfg.items.length; const place=Array(n).fill(null); const ord=shuffle(cfg.items.map((_,i)=>i)); let tries=0, done=false;
  const root=el(`<div><p>${cfg.prompt}</p><div class="sortgrid">${cfg.cols.map(([nm,ic],k)=>`<div class="sortcol" data-col="${k}"><h5>${icon(ic)}${nm}</h5><div class="in"></div></div>`).join('')}</div>
    <div class="subhead" style="font-size:17px;margin:14px 0 8px">Statements to sort</div><div class="unsorted"></div>
    <div class="rowbtns"><button class="btn btn-p btn-sm" data-a="check" disabled>Check</button><button class="btn btn-g btn-sm" data-a="show" hidden>Show me the answers</button></div><div class="fbw" aria-live="polite"></div></div>`);
  const item=(i)=>`<div class="sitem" data-i="${i}"><span>${cfg.items[i][0]}</span><span class="sb">${cfg.cols.map(([nm],k)=>place[i]===k?'':`<button data-i="${i}" data-k="${k}" aria-label="Put “${esc(cfg.items[i][0])}” under ${nm}">${place[i]===null?'→ ':'⇄ '}${nm.split(' ')[0]}</button>`).join('')}</span></div>`;
  function draw(){ $('.unsorted',root).innerHTML=ord.filter(i=>place[i]===null).map(item).join('')||'<p style="color:var(--ink2);font-size:15px">All sorted — press Check!</p>';
    cfg.cols.forEach((_,k)=>{ $(`[data-col="${k}"] .in`,root).innerHTML=ord.filter(i=>place[i]===k).map(item).join(''); });
    if(done) $$('.sb',root).forEach(s=>s.innerHTML=''); $('[data-a=check]',root).disabled=place.includes(null)||done; }
  root.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||done) return;
    if(b.dataset.k!==undefined){ place[+b.dataset.i]=+b.dataset.k; draw(); return; }
    if(b.dataset.a==='check'){ tries++; const wrong=place.map((p,i)=>p!==cfg.items[i][1]?i:-1).filter(i=>i>=0); track(cfg.c, !wrong.length&&tries===1);
      draw(); $$('.sitem',root).forEach(s=>s.classList.add(wrong.includes(+s.dataset.i)?'wrong':'right'));
      if(!wrong.length){ done=true; draw(); $$('.sitem',root).forEach(s=>s.classList.add('right')); $('.fbw',root).innerHTML=`<div class="fb ok"><b>All sorted correctly!</b>${cfg.why||''}</div>`; $('[data-a=show]',root).hidden=true; onDone&&onDone(); }
      else { $('.fbw',root).innerHTML=`<div class="fb no"><b>${wrong.length} statement${wrong.length>1?'s are':' is'} in the wrong group.</b>${cfg.hint||'Move the red ones and check again.'}</div>`; if(tries>=2) $('[data-a=show]',root).hidden=false; } }
    if(b.dataset.a==='show'){ done=true; cfg.items.forEach((it,i)=>place[i]=it[1]); draw(); $$('.sitem',root).forEach(s=>s.classList.add('right')); $('.fbw',root).innerHTML=`<div class="fb info"><b>Here is how they sort.</b>${cfg.why||''}</div>`; b.hidden=true; onDone&&onDone(); } });
  draw(); return root; }

/* ---------- memory missions ---------- */
function recallSet(cfg, onAttempt){ // cfg.items: [{q, accept, answer, hint, c}]
  const root=el(`<div>${cfg.items.map((it,i)=>`<div class="recall-row"><label for="mm${QN+i}">${it.q}</label><input class="inp" id="mm${QN+i}" autocomplete="off" placeholder="From memory…"><div class="fbw" aria-live="polite"></div></div>`).join('')}
    <div class="rowbtns"><button class="btn btn-p" data-a="check">Check my answers</button><button class="btn btn-g btn-sm" data-a="hint">I need a hint</button><button class="btn btn-g btn-sm" data-a="reveal" hidden>Reveal the answers</button></div><div class="fbx" aria-live="polite"></div></div>`); QN+=cfg.items.length;
  let tries=0, done=false;
  const inputs=$$('input',root), fbs=$$('.recall-row .fbw',root);
  function reveal(){ done=true; cfg.items.forEach((it,i)=>{ if(!inputs[i].classList.contains('right')) fbs[i].innerHTML=`<div class="fb info"><b>Answer: ${it.answer}</b></div>`; inputs[i].disabled=true; }); $$('.rowbtns button',root).forEach(b=>b.hidden=b.dataset.a!=='check'); $('[data-a=check]',root).disabled=true; }
  root.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||done) return;
    if(b.dataset.a==='hint'){ cfg.items.forEach((it,i)=>{ if(!inputs[i].classList.contains('right')) fbs[i].innerHTML=`<div class="fb no">Hint: ${it.hint}</div>`; }); }
    if(b.dataset.a==='reveal') reveal();
    if(b.dataset.a==='check'){ if(inputs.every(x=>!x.value.trim())){ $('.fbx',root).innerHTML=`<div class="fb no">Have a go first — type what you remember, even if you are unsure.</div>`; return; }
      tries++; if(tries===1) onAttempt&&onAttempt(b); let all=true;
      cfg.items.forEach((it,i)=>{ if(inputs[i].classList.contains('right')) return; const ok=has(inputs[i].value, it.accept); if(tries===1) track(it.c, ok);
        if(ok){ inputs[i].classList.add('right'); inputs[i].classList.remove('wrong'); inputs[i].disabled=true; fbs[i].innerHTML=`<div class="fb ok"><b>Correct!</b>${it.answer}</div>`; }
        else { all=false; inputs[i].classList.add('wrong'); fbs[i].innerHTML = tries===1 ? `<div class="fb no"><b>Not quite — try once more.</b>Hint: ${it.hint}</div>` : `<div class="fb info"><b>Answer: ${it.answer}</b></div>`; } });
      if(all){ done=true; $('.fbx',root).innerHTML=`<div class="fb ok"><b>Mission accomplished!</b>You remembered it all.</div>`; $$('.rowbtns button',root).forEach(x=>x.disabled=true); }
      else if(tries===1){ $('.fbx',root).innerHTML=''; $('[data-a=reveal]',root).hidden=false; b.textContent='Check again'; }
      else { reveal(); $('.fbx',root).innerHTML=`<div class="fb info"><b>Good effort!</b>Read the answers, then try saying them aloud without looking.</div>`; } } });
  inputs.forEach((x,i)=>x.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(inputs[i+1]) inputs[i+1].focus(); else $('[data-a=check]',root).click(); } }));
  return root; }
function explainAct(cfg, onAttempt){ // cfg: {q, ideas:[[label, keys]], model, c}
  const id='ex'+(++QN);
  const root=el(`<div><label for="${id}" class="qt" style="display:block;font-weight:700;font-size:19px;margin-bottom:8px">${cfg.q}</label>
    <textarea class="inp" id="${id}" placeholder="Write your explanation here, in your own words…"></textarea>
    <div class="rowbtns"><button class="btn btn-p" data-a="check">Check my explanation</button><button class="btn btn-g btn-sm" data-a="model" hidden>Show the model explanation</button></div><div class="fbw" aria-live="polite"></div></div>`);
  let tries=0, done=false; const ta=$('textarea',root), fb=$('.fbw',root);
  const showModel=()=>{ done=true; $$('.rowbtns button',root).forEach(b=>b.hidden=true); fb.insertAdjacentHTML('beforeend', `<div class="answer"><h4>A model explanation</h4><p style="margin:0">${cfg.model}</p></div>`); };
  root.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||done) return;
    if(b.dataset.a==='model') return showModel();
    if(b.dataset.a==='check'){ const v=ta.value.trim(); if(v.length<6){ fb.innerHTML=`<div class="fb no">Have a go first — even a few words is a great start.</div>`; ta.focus(); return; }
      tries++; if(tries===1) onAttempt&&onAttempt(b); const got=cfg.ideas.map(([lb,keys])=>has(v,keys)); const all=cfg.need? got.filter(Boolean).length>=cfg.need : got.every(Boolean); if(tries===1) track(cfg.c, got.filter(Boolean).length>=Math.ceil(got.length*0.6));
      fb.innerHTML=`<div class="fb ${all?'ok':'no'}"><b>${all?(cfg.need?'Excellent — you explained enough key ideas!':'Excellent — you included all the key ideas!'):got.some(Boolean)?'Good start! Here are the key ideas:':'Here are the key ideas to include:'}</b>
        <ul class="keyideas">${cfg.ideas.map(([lb],i)=>`<li class="${got[i]?'got':'miss'}"><i>${got[i]?'✓':'?'}</i>${got[i]?lb:(cfg.need?'You could also include: ':tries===1?'Think about: ':'')+lb}</li>`).join('')}</ul>${!all&&tries===1?'Add to your explanation and check again, or see the model explanation.':''}</div>`;
      if(all||tries>=2) showModel(); else { b.textContent='Check again'; $('[data-a=model]',root).hidden=false; } } });
  return root; }
function memoryAct(m, onAttempt){ if(m.type==='recall') return recallSet(m, onAttempt); if(m.type==='explain') return explainAct(m, onAttempt);
  if(m.type==='order'){ let fired=false; return orderAct(Object.assign({words:true}, m), null, ()=>{ if(!fired){ fired=true; onAttempt&&onAttempt(document.activeElement); } }); }
  if(m.type==='multi'){ const root=el(`<div></div>`); let fired=false; const att=(b)=>{ if(!fired){ fired=true; onAttempt&&onAttempt(b); } }; m.parts.forEach(p=>{ if(p.h) root.appendChild(el(`<div class="subhead">${p.h}</div>`)); root.appendChild(memoryAct(p, att)); }); return root; } }

function pieChart(){
  const data=[['Oxygen',65,'#E8796B','O'],['Carbon',18,'#4E5C62','C'],['Hydrogen',10,'#8EC3E6','H'],['Nitrogen',3,'#159E93','N'],['Calcium',2,'#F4CE70','Ca'],['Other elements',2,'#A9D8CC','…']];
  const notes={Oxygen:'Oxygen is found in water and in almost every other molecule in your body.',Carbon:'Carbon is the backbone of proteins, fats, sugars and DNA.',Hydrogen:'Hydrogen atoms are tiny and light, so although there are lots of them they add up to only about 10% of the mass.',Nitrogen:'Nitrogen is found in proteins and in DNA.',Calcium:'Most of your calcium is in your bones and teeth, keeping them strong.','Other elements':'Including phosphorus, potassium, sulfur, sodium, chlorine, magnesium and iron, in small amounts.'};
  let a0=-Math.PI/2, paths=''; const cx=120, cy=120, R=100, r=52;
  data.forEach(([n,p,col,sym],i)=>{ const a1=a0+p/100*Math.PI*2; const lg=p>50?1:0; const P=(a,rr)=>`${(cx+rr*Math.cos(a)).toFixed(1)} ${(cy+rr*Math.sin(a)).toFixed(1)}`;
    paths+=`<path class="slice" data-i="${i}" tabindex="0" role="button" aria-label="${n}: ${p} percent of body mass" d="M${P(a0,R)} A${R} ${R} 0 ${lg} 1 ${P(a1,R)} L${P(a1,r)} A${r} ${r} 0 ${lg} 0 ${P(a0,r)}Z" fill="${col}" stroke="#fff" stroke-width="2.5" style="cursor:pointer;transition:transform .3s;transform-origin:${cx}px ${cy}px"/>`;
    if(p>=10){ const am=(a0+a1)/2; paths+=`<text x="${(cx+76*Math.cos(am)).toFixed(1)}" y="${(cy+76*Math.sin(am)+5).toFixed(1)}" text-anchor="middle" class="svgw" font-size="14" pointer-events="none">${sym}</text>`; }
    a0=a1; });
  const root=el(`<div class="panel"><svg viewBox="0 0 240 240" role="group" aria-label="Pie chart of the elements in the human body by mass. Tap a slice.">${paths}<circle cx="${cx}" cy="${cy}" r="${r-2}" fill="#FAF8F2"/>
    <text id="pv" x="${cx}" y="${cy+4}" text-anchor="middle" class="svgt" font-size="30">Tap</text><text id="pn" x="${cx}" y="${cy+24}" text-anchor="middle" class="svgl" font-size="11.5">a slice</text></svg>
    <div class="chips">${data.map(([n,p,col],i)=>`<button class="chip" data-i="${i}" aria-pressed="false"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${col};margin-right:6px;vertical-align:-1px"></span>${n}</button>`).join('')}</div>

  const pick=i=>{ const [n,p]=data[i]; $$('.slice',root).forEach((s,k)=>{ s.style.transform=k===i?'scale(1.07)':''; s.style.opacity=k===i?1:.45; });
    $$('.chip',root).forEach((c,k)=>c.setAttribute('aria-pressed',k===i)); $('#pv',root).textContent=p+'%'; $('#pn',root).textContent=n;
    $('.info',root).innerHTML=`<h4>${n} — about ${p}%</h4>${notes[n]}`; };
  root.addEventListener('click',e=>{ const t=e.target.closest('[data-i]'); if(t) pick(+t.dataset.i); });
  root.addEventListener('keydown',e=>{ const t=e.target.closest('.slice'); if(t&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); pick(+t.dataset.i); } });
  return root; }
