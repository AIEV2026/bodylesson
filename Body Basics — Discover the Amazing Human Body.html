  discover:{ lines:['Your heart is a powerful muscular organ.','It pumps blood through a network of blood vessels.','Blood delivers oxygen and nutrients to cells.','It also carries away waste substances.','<strong>Arteries</strong> carry blood away from the heart.','<strong>Veins</strong> carry blood towards the heart.','<strong>Capillaries</strong> are tiny blood vessels where substances can move between blood and body tissues.'],
    visual:()=>{ const t=tabsVisual([
      {t:'The heart', node:()=>hotspot(heartArt(true), {v:{t:'Ventricles',d:'The two large lower chambers. Their thick muscular walls squeeze to pump blood out.'}, ra:{t:'Right atrium',d:'Receives oxygen-poor blood returning from the body.'}, la:{t:'Left atrium',d:'Receives oxygen-rich blood returning from the lungs.'}, ao:{t:'Aorta',d:'The largest artery. It carries oxygen-rich blood from the heart to the body.'}, pa:{t:'Pulmonary artery',d:'Carries oxygen-poor blood from the heart to the lungs.'}, vc:{t:'Vena cava',d:'Large veins bringing oxygen-poor blood back to the heart.'}}, 'Tap a part of the heart.')},
      {t:'Circulatory system', node:()=>hotspot(circulatoryBody(), {heart:{t:'Heart',d:'The pump at the centre of the system, in your chest.'}, art:{t:'Arteries (red)',d:'Carry blood away from the heart to every part of the body.'}, vein:{t:'Veins (blue)',d:'Carry blood back towards the heart.'}}) } ]);
      t.appendChild(el(`<div class="callout"><b>About the colours:</b> diagrams use red for oxygen-rich blood and blue for oxygen-poor blood. Real blood is always a shade of red — bright red with lots of oxygen and darker red with less.</div>`)); return t; } },
  watch:{ intro:'Follow the blood’s route: heart → lungs → heart → body → heart.', anims:['circ'] },
  think:[{ q:'Why do your heart and lungs need to work together?', a:'The lungs bring oxygen into the blood, and the heart pumps blood around the body.', hint:'Which one collects the oxygen, and which one moves the blood?', c:'circ' }],
  play:[{ h:'Match the part to its job', type:'match', lt:'Part', rt:'Job', c:'circ', pairs:[['Heart','Pumps blood','heart'],['Arteries','Carry blood away from the heart'],['Veins','Carry blood towards the heart'],['Capillaries','Allow exchange with tissues']], hint:'Remember: <b>A</b>rteries go <b>A</b>way from the heart.' }],
  memory:{ type:'explain', intro:'Explain it as if you were teaching a friend.', q:'Explain how the heart and lungs work together.', c:'circ',
    ideas:[['The lungs take in oxygen',['oxygen','o2']],['Oxygen enters the blood in the lungs',['blood']],['The heart pumps the blood',['pump']],['Blood carries oxygen around the body to cells',['body','cell','around','round']]],
    model:'When we breathe in, oxygen enters the lungs and moves into the blood. The blood goes to the heart, which pumps it around the body through arteries. Body cells take the oxygen they need, and the blood returns to the heart and lungs to collect more.' },
  deeper:[['The pulmonary artery carries oxygen-poor blood. Does that break the rule that arteries carry blood away from the heart?','No. Arteries are defined by direction (away from the heart), not by how much oxygen they carry. The pulmonary artery carries blood away from the heart to the lungs.'],['Find your pulse at your wrist. What causes the throbbing you can feel?','Each heartbeat pushes a surge of blood through your arteries, making their stretchy walls bulge slightly.']]
};
LESSONS[8] = { d:8, adv:2, title:'The Amazing Journey of Food', dur:'8–9 min', ic:'apple', bg:'bg-cream', topic:'dig',
  central:'The digestive system breaks food into small molecules that are absorbed into the blood.',
  wake:{ qs:[ R('What does the heart pump?',['blood'],'Blood','circ','It is red and flows through vessels.'),
    Y('What useful substances can blood carry?',['Oxygen and nutrients','Bones and muscles','Only water'],0,'circ','Blood delivers oxygen and nutrients to cells, and carries away waste.') ] },
  discover:{ hook:'How can an apple become part of your growing body?',
    lines:['Food contains <strong>nutrients</strong> your body needs.','Your <strong>digestive system</strong> breaks food into smaller substances.','Digestion begins in your mouth, where you chew food and mix it with saliva.','Food travels down the <strong>oesophagus</strong> into the <strong>stomach</strong>.','Digestion continues in the <strong>small intestine</strong>.','Most nutrients are absorbed through the small intestine into the blood.','The <strong>large intestine</strong> absorbs water from the remaining material.','Waste eventually leaves the body through the anus.'],
    visual:()=>hotspot(digestiveArt(true), {mouth:{t:'Mouth',d:'Teeth chew food into small pieces, and saliva starts digestion.'}, oes:{t:'Oesophagus',d:'A muscular tube that squeezes food down to the stomach.'}, stom:{t:'Stomach',d:'A stretchy bag that churns food with acid and digestive juices.'}, small:{t:'Small intestine',d:'A long coiled tube (about 6 metres!). Digestion finishes here and most nutrients are absorbed into the blood.'}, large:{t:'Large intestine',d:'Wider but shorter. It absorbs water from the remaining material.'}, rect:{t:'Rectum',d:'Stores waste until it leaves the body.'}, anus:{t:'Anus',d:'The opening where waste leaves the body.'}}) },
  watch:{ intro:'Follow a piece of apple on its journey through the digestive system.', anims:['food'] },
  think:[{ q:'Why must food be broken into smaller substances?', a:'Many nutrients need to be broken into small enough molecules to pass through the intestinal lining and enter the body.', hint:'Could a whole piece of apple pass through the wall of the intestine into a tiny blood vessel?', c:'dig' }],
  play:[
    { h:'Sequencing game', type:'order', prompt:'Put the parts of the digestive system in the order that food travels through them.', c:'dig', items:[{label:'Mouth'},{label:'Oesophagus'},{label:'Stomach'},{label:'Small intestine'},{label:'Large intestine'},{label:'Anus'}], words:true, ends:['Start','End'], why:'Mouth → Oesophagus → Stomach → Small intestine → Large intestine → Anus.' },
    { h:'Quick question', type:'quiz', qs:[ Y('Where are most nutrients absorbed?',['Stomach','Small intestine','Oesophagus'],1,'dig','Its lining has a huge surface area for absorbing nutrients into the blood.','Which part is very long and coiled?') ] } ],
  memory:{ type:'multi', intro:'Rebuild the pathway without looking — then try the bonus question.', parts:[
    { type:'order', h:'Rebuild the digestive pathway', prompt:'Put the parts in order, from start to end.', c:'dig', ends:['Start','End'], items:[{label:'Mouth'},{label:'Oesophagus'},{label:'Stomach'},{label:'Small intestine'},{label:'Large intestine'},{label:'Anus'}], why:'Mouth → Oesophagus → Stomach → Small intestine → Large intestine → Anus.' },
    { type:'explain', h:'Bonus question', q:'How do the digestive and circulatory systems help each other?', c:'dig', ideas:[['The digestive system breaks down food and makes nutrients available',['digest','break','nutrient']],['Nutrients are absorbed into the blood',['absorb','blood']],['Blood carries nutrients around the body',['carr','transport','around','round','body']]], model:'The digestive system makes nutrients available for absorption, and blood transports absorbed nutrients around the body.' } ] },
  deeper:[['The small intestine is lined with millions of tiny finger-like folds called villi. How do they help?','They greatly increase the surface area, so nutrients can be absorbed into the blood much faster.'],['Why is it helpful to chew food well?','Smaller pieces have more surface for digestive juices to work on, and are easier to swallow.']]
};
LESSONS[9] = { d:9, adv:2, title:'Support, Movement and Protection', dur:'9–10 min', ic:'bone', bg:'bg-mint', topic:'move',
  central:'Bones support and protect, muscles move us, white blood cells defend us, and the reproductive system produces reproductive cells.',
  wake:{ qs:[ R('Which organ pumps blood?',['heart'],'The heart','circ','It beats in your chest.'),
    Y('Where are most nutrients absorbed?',['Stomach','Small intestine','Large intestine'],1,'dig','The long, coiled small intestine absorbs most nutrients into the blood.') ] },
  discover:{ lines:['## Skeletal system','Your skeleton is a framework of bones.','It supports your body, protects delicate organs and works with muscles to help you move.','## Muscular system','Muscles <strong>contract</strong> to produce movement.','They help you walk, jump, smile and keep your heart beating.','## Immune system','Your immune system helps protect you against harmful germs.','<strong>White blood cells</strong> are important parts of this defence.','## Reproductive system','The reproductive system becomes more active as the body matures.','It produces reproductive cells that are involved in human reproduction.'],
    visual:()=>cardPicker([
      {t:'Skeletal system', art:icon('bone'), big:skeleton(), bw:200, d:'About 206 bones in an adult. The skull protects the brain and the ribcage protects the heart and lungs.'},
      {t:'Muscular system', art:icon('muscle'), big:muscularBody(), bw:200, d:'More than 600 muscles. Skeletal muscles pull on bones; heart muscle pumps blood.'},
      {t:'Immune system', art:icon('shield'), big:wbcArt(), bw:300, d:'White blood cells find and destroy harmful bacteria and viruses.'},
      {t:'Reproductive system', art:icon('egg'), big:reproCells(), bw:320, d:'Reproductive cells: an egg cell and a sperm cell. A new human life begins when these two cells join.'} ], 'bench', 'Tap a card to look closer at each system.') },
  watch:{ intro:'Two animations: how muscles move bones, and how a white blood cell defends you.', anims:['arm','phago'] },
  think:[{ q:'Could your skeleton move your arm without muscles?', a:'No. Muscles pull on bones to produce movement at joints.', hint:'Watch the arm animation again. What pulled the forearm up?', c:'move' }],
  play:[
    { h:'Match the job to the system', type:'match', lt:'Job', rt:'System', c:'move', pairs:[['Supports and protects','Skeletal'],['Produces movement','Muscular'],['Defends against germs','Immune'],['Produces reproductive cells','Reproductive']] },
    { h:'Body systems review — all eight', type:'match', lt:'System', rt:'Main job', c:'move', pairs:[['Nervous','Communication and control','brain'],['Respiratory','Gas exchange','lungs'],['Circulatory','Transport','heart'],['Digestive','Food breakdown and nutrient absorption','stomach'],['Skeletal','Support and protection','bone'],['Muscular','Movement','muscle'],['Immune','Defence','shield'],['Reproductive','Reproduction','egg']] } ],
  memory:{ type:'explain', intro:'Choose any four systems you remember.', q:'Name four body systems and explain their main jobs.', c:'move', need:4,
    ideas:[['Nervous — communication and control',['nerv']],['Respiratory — gas exchange',['respir','lung','breath']],['Circulatory — transport of blood',['circul','heart','blood']],['Digestive — breaks down food and absorbs nutrients',['digest','food']],['Skeletal — support and protection',['skelet','bone']],['Muscular — movement',['muscl','move']],['Immune — defence against germs',['immun','germ','defen']],['Reproductive — reproduction',['reproduc']]],
    model:'For example: the nervous system controls the body and carries messages; the respiratory system exchanges gases in the lungs; the circulatory system transports blood, oxygen and nutrients; the digestive system breaks down food and absorbs nutrients; the skeletal system supports and protects; the muscular system produces movement; the immune system defends against germs; the reproductive system is involved in reproduction.' },
  deeper:[['Your heart is made of muscle, but you never decide to make it beat. How is heart muscle different from arm muscle?','Heart (cardiac) muscle contracts automatically and rhythmically without tiring. Arm (skeletal) muscle contracts when you choose to move.'],['Vaccines help the immune system. How do you think they work?','They safely show the immune system what a germ looks like, so it can respond faster and more strongly if the real germ ever arrives.']]
};
LESSONS[10] = { d:10, adv:3, title:'X-rays, CT Scans and MRI', dur:'8–9 min', ic:'xray', bg:'bg-blue', topic:'img',
  central:'X-rays, CT and MRI let doctors see inside the body without opening it.',
  wake:{ qs:[ Y('Which system contains bones?',['Skeletal system','Muscular system','Nervous system'],0,'move','The skeletal system is a framework of bones.'),
    R('Which system includes the brain and nerves?',['nervous','nerve'],'The nervous system','nerv','It is the body’s communication network.') ] },
  discover:{ hook:'How can doctors see what is happening inside your body without opening it?',
    lines:['Doctors use special technologies to examine the inside of the body.','<strong>X-rays</strong> are a form of electromagnetic radiation.','Different tissues absorb X-rays differently, allowing bones to show up clearly.','<strong>CT scanners</strong> use X-ray measurements taken from different angles.','A computer combines the measurements to create detailed cross-sectional images.','<strong>MRI</strong> uses strong magnetic fields and radio waves to create detailed images, especially of soft tissues such as the brain.'],
    visual:()=>tabsVisual([
      {t:'X-ray of a hand', node:`<div class="panel" style="max-width:300px;margin:0 auto">${xrayArt()}</div>`, d:'<b>X-ray.</b> Bones absorb more X-rays than soft tissues, so they appear bright white. Great for spotting broken bones. <i>Simulated illustration.</i>'},
      {t:'CT of the abdomen', node:`<div class="panel" style="max-width:330px;margin:0 auto">${ctArt()}</div>`, d:'<b>CT cross-section.</b> Like looking at a slice through the body from below: you can see the spine, kidneys, liver and bowel. <i>Simulated illustration.</i>'},
      {t:'MRI of the brain', node:`<div class="panel" style="max-width:330px;margin:0 auto">${mriArt()}</div>`, d:'<b>MRI.</b> Shows soft tissues in fine detail, such as the folds of the brain. <i>Simulated illustration.</i>'} ]) },
  watch:{ intro:'Three short animations show how each machine works.', anims:['xray','ct','mri'] },
  think:[{ q:'Why might a doctor use MRI rather than a simple X-ray to examine the brain?', a:'MRI can show soft tissues, including brain structures, in greater detail.', hint:'What shows up clearly on an X-ray? Is the brain like that?', c:'img' }],
  play:[{ h:'Medical matching game', type:'match', lt:'Medical question', rt:'Best tool', c:'img', pairs:[['Suspected broken finger','X-ray','xray'],['Detailed cross-sectional images','CT'],['Detailed brain tissue images','MRI','brain']] }],
  memory:{ type:'explain', intro:'No pictures to help you this time.', q:'Identify all three imaging technologies and explain one use for each.', c:'img',
    ideas:[['X-ray — for example, checking for broken bones',['x ray','xray']],['CT — detailed cross-sectional images',['=ct','computed tomography','cat scan']],['MRI — detailed images of soft tissues such as the brain',['=mri','magnetic']]],
    model:'X-rays can show bones clearly, so they are used to check for broken bones. CT scanners take X-ray measurements from many angles to make detailed cross-sectional images. MRI uses strong magnetic fields and radio waves to make detailed images of soft tissues, such as the brain.' },
  deeper:[['X-ray staff stand behind a screen or leave the room when taking an X-ray. Why?','X-rays carry energy that can damage cells. One X-ray is a very small dose for a patient, but staff take many each day, so they protect themselves.'],['Why must people remove metal objects before an MRI scan?','MRI uses an extremely strong magnet, which can pull on metal objects and also spoil the image.']]
};
LESSONS[11] = { d:11, adv:3, title:'Ultrasound and Endoscopes', dur:'7–8 min', ic:'ultrasound', bg:'bg-mint', topic:'img',
  central:'Ultrasound builds pictures from echoes of sound; an endoscope uses a camera to look directly inside.',
  wake:{ qs:[ R('Which imaging method uses strong magnetic fields?',['=mri','magnetic resonance'],'MRI','img','Three letters, great for the brain.'),
    Y('Which method uses X-rays to produce cross-sectional images?',['CT','MRI','Ultrasound'],0,'img','CT combines X-ray measurements from many angles into slices.') ] },
  discover:{ lines:['<strong>Ultrasound</strong> uses high-frequency sound waves.','The sound waves travel into the body and bounce back from different tissues.','A computer uses the returning echoes to make pictures.','Doctors often use ultrasound to examine developing babies before birth and many other body structures.','An <strong>endoscope</strong> is a thin tube with a camera and light.','Doctors can guide it into the body to look directly at internal surfaces.'],
    visual:()=>tabsVisual([{t:'Ultrasound', node:`<div class="panel">${ultrasoundArt()}</div>`, d:'The probe sends sound waves in and listens for the echoes. It is safe and painless.'},{t:'Endoscope', node:`<div class="panel">${endoscopeArt()}</div>`, d:'A flexible tube with a light and camera. The doctor sees the inside surface directly on a screen.'}]) },
  watch:{ intro:'Watch both tools in action.', anims:['ultra','endo'] },
  think:[{ q:'Why might a doctor choose an endoscope to examine the stomach lining?', a:'An endoscope allows the doctor to see the internal surface directly.', hint:'Which tool gives a real camera picture of a surface?', c:'img' }],
  play:[{ h:'Interactive matching', type:'match', lt:'Clue', rt:'Tool', c:'img', pairs:[['Uses sound waves','Ultrasound'],['Uses a camera on a tube','Endoscope'],['Often used to examine a developing baby','Ultrasound']], why:'Ultrasound uses sound waves and is often used before birth; an endoscope uses a camera on a tube.' }],
  memory:{ type:'explain', intro:'Compare the two tools in your own words.', q:'Explain the difference between ultrasound and an endoscope.', c:'img',
    ideas:[['Ultrasound uses sound waves and echoes',['sound','echo']],['An endoscope uses a camera (and light)',['camera']],['The endoscope goes inside the body on a thin tube',['tube','inside','into']]],
    model:'Ultrasound uses high-frequency sound waves: a probe on the skin sends them in, and a computer turns the echoes into pictures. An endoscope is a thin tube with a camera and light that is guided inside the body, so the doctor can look directly at internal surfaces.' },
  deeper:[['Bats and dolphins also use echoes. How is this similar to ultrasound?','They send out high-pitched sounds and use the returning echoes to work out where objects are — just as an ultrasound machine does.'],['Why is gel put on the skin before an ultrasound scan?','The gel removes air between the probe and skin, because air blocks the sound waves.']]
};
LESSONS[12] = { d:12, adv:3, title:'Microscopes and the Invisible World', dur:'8–9 min', ic:'microscope', bg:'bg-yellow', topic:'micro',
  central:'Light microscopes show cells and tissues; electron microscopes reveal much finer details.',
  wake:{ qs:[ Y('What does ultrasound use?',['Sound waves','X-rays','Magnets'],0,'img','High-frequency sound waves and their echoes.'),
    R('What does an endoscope have at its tip?',['camera'],'A camera and a light','img','It lets the doctor see inside.') ] },
  discover:{ lines:['Your body contains trillions of cells.','Most cells are too small to see clearly without a microscope.','A <strong>light microscope</strong> uses visible light and lenses to magnify tiny objects.','Scientists and doctors use light microscopes to examine cells and tissues.','<strong>Electron microscopes</strong> use electrons instead of light.','They can reveal much smaller details, including fine structures of bacteria and viruses.'],
    visual:()=>{ const w=el(`<div></div>`); w.appendChild(panelArt(microscopesArt(),'Two kinds of microscope (not to scale)')); w.appendChild(el(`<div style="height:10px"></div>`)); w.appendChild(panelArt(scaleArt(),'Sizes are approximate')); return w; } },
  watch:{ intro:'Zoom from a slice of tissue into the invisible world of bacteria and viruses.', anims:['micro'] },
  think:[{ q:'Why do scientists need different types of microscopes?', a:'Different microscopes can reveal different levels of detail.', hint:'Could a light microscope show you the spikes on a virus?', c:'micro' }],
  play:[
    { h:'Interactive comparison', type:'sort', c:'micro', prompt:'Sort each statement under the right microscope.', cols:[['Light microscope','microscope'],['Electron microscope','virus']],
      items:[['Uses light',0],['Useful for examining cells and tissues',0],['Can observe some living specimens',0],['Uses electrons',1],['Reveals finer details',1],['Generally requires specially prepared, non-living specimens',1]] },
    { h:'Multiple choice', type:'quiz', qs:[ Y('Which microscope is usually more suitable for examining the fine structure of a virus?',['Light microscope','Electron microscope','Magnifying glass'],1,'micro','Viruses are far too small for light microscopes to show in detail.','Viruses are the smallest things on the scale bar.') ] } ],
  memory:{ type:'explain', intro:'Explain it in one or two sentences.', q:'Explain the main difference between light and electron microscopes.', c:'micro',
    ideas:[['Light microscopes use light (and lenses)',['light','lens']],['Electron microscopes use electrons',['electron']],['Electron microscopes show much finer detail',['detail','smaller','finer','magnif','virus']]],
    model:'A light microscope uses visible light and lenses, and is useful for looking at cells and tissues. An electron microscope uses electrons instead of light, so it can reveal much finer details, such as the structure of viruses.' },
  deeper:[['Why are electron microscope images often black and white to begin with?','They are made with electrons, not light, so there is no real colour information. Colours are added afterwards to highlight different parts.'],['Why can light microscopes show living cells moving, but electron microscopes usually cannot?','Electron microscopes need specimens to be specially prepared and kept in a vacuum, which living cells cannot survive.']]
};
const STATIONS = [
  {short:'Ancient Egyptians', date:'about 3000–1000 BCE', name:'Ancient Egyptians', art:TL.egypt, text:['Ancient Egyptians removed and preserved organs during mummification.','They recognised that the heart was important, although they did not understand circulation as we do today.'], why:'Some of the earliest written medical knowledge comes from Egyptian papyrus scrolls.'},
  {short:'Hippocrates', date:'around 400 BCE', name:'Hippocrates of Kos', art:TL.greek, text:['Hippocrates was an ancient Greek doctor.','He helped encourage the idea that illnesses have natural causes rather than being punishments from gods.'], why:'Looking for natural causes encouraged careful observation of patients — a key step towards scientific medicine.'},
  {short:'Vesalius', date:'1500s', name:'Andreas Vesalius', art:TL.vesalius, text:['Vesalius carefully studied human anatomy through dissection and produced detailed anatomical drawings.','His work helped make the study of the body more accurate.'], why:'He checked old ideas against what he actually observed, and corrected many mistakes.'},
  {short:'Van Leeuwenhoek', date:'1670s', name:'Antonie van Leeuwenhoek', art:TL.leeuwen, text:['Van Leeuwenhoek built powerful simple microscopes.','He observed tiny living organisms that people had never seen before.'], why:'He opened up the invisible world of microorganisms and cells.'},
  {short:'DNA structure', date:'1953', name:'The structure of DNA', art:TL.dna, text:['James Watson and Francis Crick proposed the double-helix structure of DNA.','Their work drew on important scientific evidence, including X-ray diffraction research by Rosalind Franklin and Maurice Wilkins.'], why:'Knowing DNA’s shape helped explain how instructions are copied and passed on — the start of modern genetics.'} ];
LESSONS[13] = { d:13, adv:4, title:'How Humans Discovered the Body’s Secrets', dur:'9–10 min', ic:'scroll', bg:'bg-yellow', topic:'hist',
  central:'Knowledge of the body grew over thousands of years as people observed carefully and invented new tools.',
  wake:{ qs:[ R('What instrument helps scientists examine cells?',['microscope'],'A microscope','micro','It uses lenses to magnify.'),
    Y('Which imaging method uses sound waves?',['Ultrasound','MRI','CT'],0,'img','Ultrasound builds images from echoes.') ] },
  discover:{ hook:'How did people learn about the body before modern scanners and microscopes existed?',
    lines:['People have been trying to understand the human body for thousands of years.','Long ago, people had no X-rays, microscopes or computers.','They learned through observation, experience and sometimes examining bodies.','As new scientific tools were invented, people discovered more about how the body works.'],
    visual:()=>panelArt(svgWrap('0 0 420 150', [['eye','Observing'],['book','Drawing'],['microscope','Microscopes'],['xray','X-rays'],['dna','DNA']].map(([k,n],i)=>`<g>${nest(icon(k),14+i*82,22,62,62)}${T(45+i*82,108,n,12)}</g>`).join('')+`<path d="M20 128 H400" stroke="#0E7A71" stroke-width="3" marker-end="url(#arwT)"/>${T(30,145,'Long ago',11,'start')}${T(400,145,'Today',11,'end')}`, 'Tools for discovering the body, from long ago to today: observing, drawing, microscopes, X-rays and DNA science'), 'New tools let people discover more and more') },
  watch:{ intro:'Explore the timeline. Visit all five stations — tap a station or use the arrows.', timeline:true },
  think:[{ q:'Why did the invention of microscopes change what scientists knew about the body?', a:'Microscopes allowed scientists to observe cells and microorganisms that could not be seen with the naked eye.', hint:'What could people see with a microscope that they could not see before?', c:'hist' }],
  play:[{ h:'Interactive timeline game', type:'order', prompt:'Arrange the five discoveries in <b>chronological order</b> (earliest first).', ends:['Earliest','Most recent'], c:'hist', items:[{label:'Ancient Egyptians',icon:'jar'},{label:'Hippocrates',icon:'scroll'},{label:'Vesalius',icon:'book'},{label:'Van Leeuwenhoek',icon:'microscope'},{label:'DNA structure',icon:'dna'}], why:'Ancient Egyptians → Hippocrates → Vesalius → Van Leeuwenhoek → DNA structure.' }],
  memory:{ type:'choose', intro:'Pick the discovery you found most interesting.', q:'Choose one discovery and explain why it mattered.', c:'hist' },
  deeper:[['Rosalind Franklin’s X-ray images were vital evidence for DNA’s structure. Why is it important to recognise everyone who contributes to a discovery?','Science is usually teamwork. Fair credit is honest, encourages people to share evidence, and helps us understand how discoveries really happen.'],['Can you think of a modern invention that might change what we know about the body in the future?','Possible answers: more powerful scanners, genetic sequencing, artificial intelligence that spots patterns in images, tiny cameras you can swallow.']]
};
LESSONS[14] = { d:14, adv:4, title:'The Great Body Explorer Challenge', dur:'10 min', ic:'body', bg:'bg-mint', topic:null, final:true,
  central:'Everything fits together: building blocks, systems working together, and the tools scientists use.',
  wake:{ qs:[ R('Which level of organisation comes straight after tissue?',['organ'],'Organ','org','The heart is an example.'),
    Y('Which tool would you use to check for a broken finger?',['X-ray','Ultrasound','Endoscope'],0,'img','Bones absorb X-rays, so they show up clearly.') ], boosters:2 },
  discover:{ lines:['You’ve explored the amazing human body!','You’ve discovered its tiny building blocks, met its organ systems, and learned how scientists investigate it.','Now let’s put everything together.','Tap the items on the workbench to refresh your memory before the missions.'],
    visual:()=>cardPicker([
      {t:'Atom & molecule', ic:'molecule', d:'Atoms join together to form molecules, such as water (H₂O) and DNA.'},
      {t:'Cell & tissue', ic:'tissue', d:'Cells are the basic living units. Similar cells form tissues.'},
      {t:'Organs', ic:'heart', d:'Different tissues form organs, such as the heart, lungs, brain and stomach.'},
      {t:'Body systems', ic:'system', d:'Organs work together in systems: nervous, respiratory, circulatory, digestive, skeletal, muscular, immune and reproductive.'},
      {t:'Medical imaging', ic:'xray', d:'X-rays, CT, MRI, ultrasound and endoscopes let doctors look inside the body.'},
      {t:'Microscopes', ic:'microscope', d:'Light microscopes show cells and tissues; electron microscopes reveal viruses and fine details.'},
      {t:'Discoveries', ic:'scroll', d:'From Egyptian papyrus to the DNA double helix, knowledge grew as tools improved.'} ], 'bench', 'Tap an item on the scientific workbench.') },
  watch:{ intro:'See the big picture: from atoms to a whole working human.', anims:['big'] },
  think:[
    { h:'Mission 4 — Connect the systems', q:'Why do the heart and lungs work together?', a:'The lungs allow oxygen to enter the blood, and the heart pumps blood around the body.', c:'circ', hint:'One collects oxygen; one moves blood.' },
    { q:'How do the digestive and circulatory systems work together?', a:'The digestive system allows nutrients to be absorbed, and blood transports them around the body.', c:'dig', hint:'Where do nutrients go after the small intestine?' },
    { q:'Why do bones and muscles work together?', a:'Bones provide support and act as levers, while muscles pull to produce movement.', c:'move', hint:'Can muscles push? What do they pull on?' } ],
  play:[

       <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${s.lvl==='need'?'btn-p':'btn-s'} btn-sm" data-pr="${k}" ${avail?'':'disabled'}>Practise</button><button class="btn btn-g btn-sm" data-go="day-${c.lesson}">Revisit Day ${c.lesson}</button></div>${avail?'':'<small style="color:var(--ink2)">Unlocks when you start Day '+c.lesson+'.</small>'}<div class="px"></div></div>`; }).join('')}</div></div>`;
  app().firstElementChild.addEventListener('click', e=>{ const b=e.target.closest('[data-pr]'); if(!b) return; const k=b.dataset.pr; const box=$('.px', b.closest('.concept')); const bank=BANK[k]; const st=(S.seen[k]||0);
    const qs=[0,1,2].map(j=>bank[(st+j)%bank.length]).filter((q,i,a)=>a.indexOf(q)===i); S.seen[k]=st+qs.length; save(); box.innerHTML='';
    box.appendChild(quizSet(qs, ()=>{ box.appendChild(el(`<div class="fb ok"><b>Practice complete!</b>${status(k).txt}.</div>`)); const lv=$('.lvl', b.closest('.concept')); const s2=status(k); lv.className='lvl '+s2.lvl; lv.textContent=s2.txt; $('.meter i', b.closest('.concept')).style.width=Math.round(s2.p*100)+'%'; })); }, {once:false}); }

/* ---------- parents ---------- */
function renderParents(){
  const acts=['Discuss why water is important to the body.','Use small objects to represent atoms joining into molecules.','Make paper cards labelled cell, tissue, organ and system. Ask your child to arrange them.','Invite your child to explain how tiny cells form a complete body.','Discuss why the hand moves away quickly from danger. Do not deliberately touch hot objects.','Notice how breathing changes after gentle physical activity.','Find your pulse while resting and discuss the heart’s pumping action.','Ask your child to explain the journey of a piece of food.','Bend an arm gently and discuss the relationship between bones and muscles.','Look at an illustrated X-ray and discuss what it reveals.','Discuss how doctors use different tools for different purposes.','Examine an everyday object with a magnifying glass.','Discuss how new inventions can change scientific knowledge.','Ask your child to teach you three things they remember about the human body.'];
  const faq=[['Does my child need to study every day?','No. Lessons are designed as daily activities, but children can learn at their own pace.'],['What if a lesson takes longer than ten minutes?','Pause and continue later. Understanding is more important than speed.'],['Does my child need to memorise every percentage or historical date?','No. The main goal is to understand the scientific concepts and their relationships.'],['Should I sit with my child during every lesson?','Not necessarily. The experience is designed for independent use, but discussion with a parent can deepen understanding.'],['What if my child answers incorrectly?','The application provides feedback and opportunities to try again.'],['Can my child repeat a lesson?','Yes. Completed lessons remain available for review.'],['Are the reproductive system lessons age-appropriate?','Yes. The introduction is brief, factual and focused on the system’s basic biological role.'],['Where is my child’s progress stored?','Progress and coins are saved only in this browser on this device. No account, name or personal information is collected. Clearing your browser data, or using a different device, starts afresh.']];
  app().innerHTML=`<article class="parents"><header class="phero"><div class="wrap"><span class="kicker">For parents</span><h1>Your Guide to Body Basics</h1>
    <nav class="toc" aria-label="Sections">${[['p-overview','Overview'],['p-learn','What will my child learn?'],['p-approach','The learning approach'],['p-home','Helping at home'],['p-ages','Different ages'],['p-outcomes','End-of-chapter outcomes'],['p-coins','The coin system'],['p-struggle','When your child struggles'],['p-faq','FAQs'],['p-deeper','Go Deeper questions']].map(([i,n])=>`<a href="#parents" data-jump="${i}">${n}</a>`).join('')}</nav></div></header>
   <div class="pbody">
    <h2 id="p-overview">Overview</h2>
    <p class="lede">Body Basics is a 14-day interactive introduction to human biology for children aged 9–13.</p>
    <p>Each lesson takes approximately 5–10 minutes and uses illustrations, animations, interactive activities and memory challenges.</p>
    <p>The aim is to develop scientific understanding, curiosity and long-term recall rather than memorising large amounts of information.</p>
    <div class="pcards"><div class="pcard"><small>Ages</small><b>9–13</b></div><div class="pcard"><small>Lessons</small><b>14</b></div><div class="pcard"><small>Daily time</small><b>5–10 min</b></div><div class="pcard"><small>Subject</small><b>Human biology</b></div></div>
    <h2 id="p-learn">What will my child learn?</h2>
    <div class="advlist">${[['Building a Body','Children learn about atoms, molecules, cells, tissues, organs and systems.'],['Body Systems','Children explore the nervous, respiratory, circulatory, digestive, skeletal, muscular, immune and reproductive systems.'],['Looking Inside','Children learn how medical imaging and microscopes allow scientists and doctors to examine the body.'],['Medical Discovery','Children explore important historical discoveries and consolidate their learning.']].map(([t,d],i)=>`<div><span class="num">${i+1}</span><span><b>Adventure ${i+1} — ${t}</b>${d}</span></div>`).join('')}</div>
    <p>Every lesson follows the same calm six-stage pattern: <b>Wake Up Your Brain</b> (recalling earlier ideas), <b>Discover</b>, <b>Watch and Explore</b>, <b>Think Like a Scientist</b>, <b>Play and Remember</b> and a <b>Memory Mission</b>.</p>
    <h2 id="p-approach">How does the learning approach work?</h2>
    <div class="approach">${[['clock','Bite-sized learning','Short lessons focus on a small number of ideas to reduce overload.'],['memory','Retrieval practice','Children try to remember information without immediately looking at the answer.'],['spiral','Spaced repetition','Important ideas return across multiple lessons.'],['eye','Visual learning','Illustrations and animations help explain structures and processes.'],['hands','Active learning','Children predict, compare, sequence, explain and solve problems.']].map(([ic,t,d])=>`<div class="acard">${icon(ic)}<h4>${t}</h4><p>${d}</p></div>`).join('')}</div>
    <p>These approaches are well supported by research into how people learn, and they support learning — but they do not guarantee identical results for every child. Every child learns at their own pace.</p>
    <h2 id="p-home">How can parents help at home?</h2><h3>Five Minutes of Science Together</h3>
    <p>Parents do not need specialist science knowledge.</p><p>The most useful thing you can do is show curiosity, ask questions and invite your child to explain what they have discovered.</p>
    <ul class="homeacts">${acts.map((a,i)=>`<li><b>Day ${i+1}</b><span>${a}</span></li>`).join('')}</ul>
    <p style="font-size:16px;color:var(--ink2)">All activities are safe, simple and need little or no special equipment.</p>
    <h2 id="p-ages">Supporting different ages</h2>
    <div class="ages"><div><h3 style="margin-top:0">Ages 9–10</h3>Encourage parents to:<ul><li>Read explanations together when needed.</li><li>Help with unfamiliar vocabulary.</li><li>Focus on identifying organs and understanding their main jobs.</li><li>Use drawings and simple explanations.</li></ul></div>
     <div><h3 style="margin-top:0">Ages 11–13</h3>Encourage:<ul><li>Greater independent learning.</li><li>More detailed explanations.</li><li>Connecting different body systems.</li><li>Justifying predictions.</li><li>Comparing scientific methods.</li></ul></div></div>
    <p>Optional <b>Go Deeper</b> questions are offered at the end of each lesson for older or more confident children. They sit outside the required 5–10-minute lesson. You will find them all at the bottom of this page.</p>
    <h2 id="p-outcomes">What should my child know at the end?</h2>
    <p>These are intended outcomes, not requirements that every child must achieve immediately.</p>
    <ul class="checklist">${['Understands that the body contains atoms and molecules.','Can explain cells, tissues, organs and systems.','Can identify the major body systems.','Can describe the main job of each system.','Understands how the heart and lungs work together.','Can describe the journey of food through the digestive system.','Recognises several medical imaging methods.','Understands why microscopes are important.','Recognises important historical discoveries.','Can explain scientific ideas using their own words.'].map(x=>`<li>${x}</li>`).join('')}</ul>
    <h2 id="p-coins">Understanding the coin system</h2>
    <p>Children earn coins for completing lessons and participating in learning activities.</p><p>Coins recognise effort and participation.</p><p>Incorrect answers do not result in lost coins.</p><p>The programme does not use badges, certificates, leaderboards or competitive rankings.</p>
    <div class="pcards" style="grid-template-columns:repeat(3,1fr)"><div class="pcard"><small>Complete the lesson</small><b>10 coins</b></div><div class="pcard"><small>Complete the activities</small><b>3 coins</b></div><div class="pcard"><small>Try the Memory Mission</small><b>2 coins</b></div></div>
    <p>That is up to 15 coins per lesson and 210 coins across all 14 lessons. Each part is awarded only once per lesson, so replaying a lesson for revision does not add duplicate coins. There is no shop and nothing to spend coins on.</p>
    <h2 id="p-struggle">Helping when your child struggles</h2>
    <p>If your child finds a question difficult, encourage them to explain their thinking.</p><p>Offer a hint, revisit the illustration or ask a simpler question.</p><p>Avoid immediately providing the answer.</p><p>Mistakes are useful opportunities for learning.</p>
    <p>The application does the same: a first wrong answer brings a hint and another try, and only then is the answer shown with an explanation. Ideas your child found tricky are flagged in the <a href="#review">Memory Gym</a> and come back as “brain boosters” in later lessons.</p>
    <h2 id="p-faq">Frequently asked questions</h2>
    <div class="faq">${faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>
    <h2 id="p-deeper">Go Deeper questions</h2><p>Optional extension questions for older or more confident children, with possible answers to support discussion.</p>
    <div class="deeplist">${Object.values(LESSONS).map(les=>`<details><summary>Day ${les.d}: ${les.title}</summary><ul>${les.deeper.map(([q,a])=>`<li><b>${q}</b><br><span style="color:var(--ink2)">${a}</span></li>`).join('')}</ul></details>`).join('')}</div>
    <p style="margin-top:30px"><button class="btn btn-p" data-go="home">Back to the chapter map</button></p>
   </div></article>`;
  app().firstElementChild.addEventListener('click', e=>{ const a=e.target.closest('[data-jump]'); if(!a) return; e.preventDefault(); const t=document.getElementById(a.dataset.jump); if(t) t.scrollIntoView({behavior:reducedMotion()?'auto':'smooth'}); }); }

  document.body.insertAdjacentHTML('afterbegin', DEFS);
  if(S.settings.calm) document.body.classList.add('calm');
  $('#logo').innerHTML = logoSVG()+'<span>Body Basics</span>';
  $('#coinpill').innerHTML = coinSVG('Coins')+'<b>'+coinsTotal()+'</b><span class="sr"> coins</span>';
  document.addEventListener('click', e=>{ const g=e.target.closest('[data-go]'); if(g && !g.disabled){ e.preventDefault(); go(g.dataset.go); } });
  const calm=$('#calm'); calm.checked=!!S.settings.calm; calm.addEventListener('change',()=>{ S.settings.calm=calm.checked; save(); document.body.classList.toggle('calm', calm.checked); });

    document.body.appendChild(m); $('[data-n]',m).focus(); m.addEventListener('click',e=>{ if(e.target.closest('[data-y]')){ S={lessons:{},concepts:{},settings:{calm:S.settings.calm},seen:{}}; save(); updatePill(); m.remove(); go('home'); } else if(e.target.closest('[data-n]')||e.target===m) m.remove(); });
    m.addEventListener('keydown',e=>{ if(e.key==='Escape') m.remove(); }); });
  window.addEventListener('hashchange', route); route(); }
